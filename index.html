<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ERP - Seguridad LTDA</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container{
            background: white;
            width: 350px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.3);
        }

        .login-container h1{
            text-align: center;
            margin-bottom: 10px;
            color: #1e3c72;
        }

        .login-container p{
            text-align: center;
            margin-bottom: 30px;
            color: gray;
        }

        .input-group{
            margin-bottom: 20px;
        }

        .input-group label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .input-group input:focus{
            border-color: #2a5298;
        }

        .btn-login{
            width: 100%;
            padding: 12px;
            border: none;
            background: #1e3c72;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover{
            background: #16325c;
        }

        .extra-links{
            margin-top: 20px;
            text-align: center;
        }

        .extra-links a{
            text-decoration: none;
            color: #1e3c72;
            font-size: 14px;
        }

        .logo{
            text-align: center;
            font-size: 50px;
            margin-bottom: 15px;
        }

    </style>

</head>
<body>

    <div class="login-container">

        <div class="logo">
            🔐
        </div>

        <h1>ERP Seguridad LTDA</h1>
        <p>Inicio de sesión</p>

        <form>

            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" placeholder="Ingrese su correo" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn-login">
                Ingresar
            </button>

        </form>

        <div class="extra-links">
            <a href="#">¿Olvidó su contraseña?</a>
        </div>

    </div>

</body>
</html>
